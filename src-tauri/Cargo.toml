[package]
name = "lumenpro"
version = "0.4.2"
description = "LUMEN PRO — consola de control DMX"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Control por celular (src/remote.rs)
tiny_http = "0.12"
if-addrs = "0.15"
qrcodegen = "1.8"
getrandom = "0.4"

# Motor DMX propio (crate `dmx-engine/` en la raíz del repo). Se referencia
# por path, no por versión publicada: es un crate interno del monorepo,
# no algo que vaya a crates.io.
lumenpro_dmx = { path = "../dmx-engine" }
lumenpro_show = { path = "../show-engine" }
midir = "0.11"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "lumenpro"
path = "src/main.rs"
