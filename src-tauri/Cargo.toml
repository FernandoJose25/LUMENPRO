[package]
name = "lumenpro"
version = "0.1.0"
description = "LUMEN PRO — consola de control DMX"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Motor DMX propio (crate `dmx-engine/` en la raíz del repo). Se referencia
# por path, no por versión publicada: es un crate interno del monorepo,
# no algo que vaya a crates.io.
lumenpro_dmx = { path = "../dmx-engine" }

[[bin]]
name = "lumenpro"
path = "src/main.rs"
