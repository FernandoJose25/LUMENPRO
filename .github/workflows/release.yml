name: Release

# Al subir una etiqueta v0.2.0, v0.3.0…: arma el instalador de Windows y lo
# publica en Releases con latest.json: la app avisa y se actualiza sola.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            show-engine
      - run: npm ci
      - run: npm test
      # Firma el instalador para que la app pueda actualizarse sola.
      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - run: node scripts/updater-json.mjs
      - uses: softprops/action-gh-release@v2
        with:
          name: LUMEN PRO ${{ github.ref_name }}
          body_path: docs/NOVEDADES.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
